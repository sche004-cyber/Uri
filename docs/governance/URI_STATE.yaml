# ---------------------------------------------------------------------------
# Architecture decisions recorded from direct User instruction (2026-09-26).
# Full exact text: docs/plans/M33_3_CROSS_PLAN_STATE.md section 2.
# ---------------------------------------------------------------------------
architecture_decisions:
  - id: "D1"
    date: "2026-09-26"
    status: "DECIDED"
    user_acceptance: "USER_ACCEPTANCE_SATISFIED"
    user_acceptance_note: "D1 is the User's acceptance of the wrong_binding_impact capability-contract classification. Gate PG-2 no longer awaits User acceptance; it awaits the focused independent re-audit RG-0R and implementation authorization."
    decision: "gmail_create_draft wrong_binding_impact = RECOVERABLE (an unsent draft is correctable before external communication). Independent of EffectType, ApprovalRequirement, RiskLevel. A future real send action is expected to be CONSEQUENTIAL. wrong_binding_impact is never derived mechanically from EffectType."
  - id: "D2"
    date: "2026-09-26"
    status: "DECIDED"
    decision: "Keep EDGE_ONLY, HYBRID, MAIN_BRAIN_PREFERRED. intelligence_mode, AUTO vs explicit model selection, and Edge ON/OFF are independent dimensions. HYBRID is efficiency-first; MAIN_BRAIN_PREFERRED is capability-first; not merged. An explicitly selected model is the Capable Brain for substantive work with native capabilities preserved; qualified supporting Edge work stays permitted. Edge OFF removes Edge inference only. EDGE_ONLY never silently calls the Capable Brain."
    recorded_in: "docs/architecture/M33_2_EDGE_SECOND_BRAIN_CANONICAL_ARCHITECTURE.md amendment G2"
  - id: "D3"
    date: "2026-09-26"
    status: "DECIDED"
    decision: "Qualified Edge or Capable models may investigate, interpret clues, compare, narrow, annotate, and return structured grounded evidence, but never create binding authority. Model preference alone never creates TENTATIVE. The flow is model evidence, then a deterministic resolution/eligibility check, then TENTATIVE / CONFIRMED / CLARIFY. Models never invent candidate IDs."
  - id: "D4"
    date: "2026-09-26"
    status: "DEFERRED"
    decision: "Durable cross-session learned reference evidence is deferred to URI-Memory (NOT_STARTED). Allowed now: session-authoritative selections, session-local reference evidence, structured Change/correction events, rank/display effects from valid session evidence. Not authorized: an ad-hoc durable reference-memory subsystem, or durable learned tie-breaking without URI-Memory qualification."
  - id: "D4-R1"
    date: "2026-09-28"
    status: "DECIDED"
    refines: "D4"
    decision: "History yes, learning no. Once URI-Memory exists, durable factual task/outcome/correction history may feed cross-session reference resolution as grounded candidates and factual recency metadata (via the evidence envelope and RARQuery projection). Learned preference or tie-break weights, frequency-based preference, and repetition-based auto-promotion remain deferred (S9, correction-rate experiment). Memory never binds a reference; RAR, D5 and S1 keep binding authority."
    recorded_in: "docs/plans/M36_STATE.md; docs/plans/M36_URI_MEMORY_MINIMUM_PLAN.md section 2.5"
  - id: "D5"
    date: "2026-09-26"
    status: "DECIDED"
    decision: "Only certainty-tier deterministic RAR rules may produce CONFIRMED: EXACT_ID; EXACT_ALIAS; ACTIVE_UI; CURRENT_ATTACHMENT only when tied to deterministic_anchor.current_attachment_id; EXACT_TITLE only when tied to deterministic_anchor.unique_title_match or an equivalent unique verbatim-title anchor. Other deterministic RESOLVED rules are only TENTATIVE-eligible through the R2.9 check. CONSEQUENTIAL or undeclared wrong_binding_impact -> CONFIRM_ONE. The same classification applies to typed free input. The classifier lives outside frozen RAR/A9."
    recorded_in: "docs/plans/M33_3_ARN_ARCHITECTURE_AND_LT1B_RENDERER_PLAN.md revision R4; docs/plans/M33_3_CROSS_PLAN_STATE.md section 2"
  - id: "D6"
    date: "2026-09-26"
    status: "DECIDED"
    decision: "S1 is the full state-file S1: deterministic clarification/binding core, deterministic template, RenderValidator, and ClarificationBundle / multi-reference contract. Not split into S1/S1b."
    recorded_in: "docs/plans/M33_3_S1_STATE.md; Plan A revision R4.7"
  - id: "S2-U1"
    date: "2026-09-26"
    status: "DECIDED"
    decision: "S2 execution-gate wiring: Action.wrong_binding_impact field, LegacyCapabilityAdapter propagation, D1 declarations, a pure gate function in uri_core/capabilities, and an opt-in reference_bindings argument on MultiActionExecutor.execute that is a strict no-op when absent. The legacy ApprovalGate path is not touched; real binding-state wiring is S13."
    recorded_in: "docs/plans/M33_3_S2_STATE.md section 3"
  - id: "S2-U2"
    date: "2026-09-26"
    status: "DECIDED"
    decision: "D1 applies to both the legacy gmail_create_draft capability and the Gmail multi-action create_draft action: RECOVERABLE."
    recorded_in: "docs/plans/M33_3_S2_STATE.md section 3"
  - id: "S2-U3"
    date: "2026-09-26"
    status: "DECIDED"
    decision: "S2 declares wrong_binding_impact only for the D1 draft actions. Every other action stays undeclared (treated as CONSEQUENTIAL); further declarations need their own User decision."
    recorded_in: "docs/plans/M33_3_S2_STATE.md section 3"
  - id: "M33.2-AMENDMENTS-G1-G3"
    date: "2026-09-26"
    status: "RECORDED_SUBJECT_TO_REAUDIT"
    decision: "G1: validated deterministic wording may be primary for SIMPLE clarification/confirmation; model wording for EXPLAIN/REASONING; the validator runs on every tier (section 3.1). G2: explicit selection routes substantive work to the selected model; qualified supporting Edge stays permitted; independent dimensions (sections 3 and 6). G3: route preference is not calibration and cannot change thresholds, qualify a failed route, or expand an unqualified role (section 9.1). M33.2 remains CLOSED_VERIFIED; no implementation reopened."
    rg0r_note: "Updated 2026-09-26 (additive). G1-G3 fidelity was within RG-0 scope and RG-0 raised no finding on it; RG-0R returned RG_0R_ACCEPTED. The RG-0R condition of gates PG-3 and PG-4 is satisfied. Status string kept as history; no implementation authorized."
  # Decisions below: direct User instruction, 2026-09-28, resolving the open
  # decisions of docs/plans/PAPERCLIP_URI_ARCHITECTURE_RECONNAISSANCE.md
  # (full text in its section 24). The M31 Brain restriction is NOT modified.
  - id: "D-A"
    date: "2026-09-28"
    status: "DECIDED"
    alias: "OD-1"
    decision: "ACCEPTED. Claude Code and Codex CLI (and future compatible harnesses) may serve as URI execution harnesses: separately launched external workers for bounded agentic execution. They are NOT the URI Brain; the M31 rule that the Brain itself must not shell out to Claude Code or Codex CLI stays unchanged. A harness receives a bounded URI Execution Capsule, works only within URI-defined task/workspace/permission boundaries, may use its own native reasoning and tools, returns claims/results to URI, does not decide that its own result is verified, and does not become URI canonical Memory. URI independently verifies consequential outcomes; a harness result stays CLAIMED_ONLY until a URI verifier establishes otherwise."
    resolves: "Research decision D-A (docs/research/URI_HARNESS_STRATEGY/00_INDEX.md, untracked) and risk R-A8. Research decision D-C (harness-internal memory and self-created skills) is only partly settled: harness state is never canonical Memory; whether to allow or disable harness-internal memory/skills remains deferred."
    recorded_in: "docs/plans/PAPERCLIP_URI_ARCHITECTURE_RECONNAISSANCE.md section 24"
  - id: "OD-2"
    date: "2026-09-28"
    status: "DECIDED"
    decision: "URI Brain access is provider- and transport-neutral. Where officially supported, users may choose subscription-backed provider channels, API-backed providers, local Ollama, local LM Studio, other compatible local runtimes, or future supported transports; subscription and API access are equally valid architectural options. The user chooses provider and access method. Do not couple BrainProvider with billing/auth method; keep BrainProvider + ProviderTransport/AuthMode as separate concepts. Brain access mode and harness access mode are separate concerns. No unsupported scraping or browser automation of ChatGPT, Claude.ai or Gemini web apps to reuse a consumer subscription."
    recorded_in: "docs/plans/PAPERCLIP_URI_ARCHITECTURE_RECONNAISSANCE.md section 24"
  - id: "OD-3"
    date: "2026-09-28"
    status: "DECIDED"
    decision: "Workspace policy is user-selectable per task. Default COPY_IN_COPY_OUT: resolve exact required files; copy only those into a URI-owned scratch workspace; record their hashes; harness works only there; URI computes changed-artifact differences; URI verifies; write-back to originals only after the required approval. DIRECT_ORIGINAL only when the user explicitly selects it for that task; never silently the default."
    recorded_in: "docs/plans/PAPERCLIP_URI_ARCHITECTURE_RECONNAISSANCE.md section 24"
  - id: "OD-4"
    date: "2026-09-28"
    status: "DECIDED"
    decision: "Harness permission profile is user-selectable per run. Restrictive default: workspace-write only; no network; no approval bypass; no unrestricted filesystem; no permission/sandbox bypass flags. URI may ask the user to elevate for a task/run (e.g. allow network, permit package installation, access an additional authorized folder, enable another specific capability). Paperclip permissive bypass defaults are not copied."
    recorded_in: "docs/plans/PAPERCLIP_URI_ARCHITECTURE_RECONNAISSANCE.md section 24"
  - id: "OD-5"
    date: "2026-09-28"
    status: "DECIDED"
    decision: "The external harness contract belongs in uri_v1/execution/ for the current architecture. uri_core/external/ concepts may be studied and adapted by reference only; uri_v1 must not import across the frozen uri_core boundary. No new shared abstraction layer until implementation evidence shows the need."
    recorded_in: "docs/plans/PAPERCLIP_URI_ARCHITECTURE_RECONNAISSANCE.md section 24"
  - id: "VG-1"
    date: "2026-09-28"
    status: "DECIDED"
    decision: "Formal future qualification requirement URI_EXTERNAL_HARNESS_VIABILITY_GATE: URI must show it is measurably worthwhile versus giving the same task directly to an external harness (Arm A direct harness, Arm B URI-mediated harness, Arm C URI local completion; avoidance vs delegation advantage). Pass principle: equal or better verified success plus a material advantage in at least one dimension without unacceptable regression elsewhere. The benchmark must not be manipulated; no-advantage results are reported honestly with the overhead layer named. Not implemented."
    recorded_in: "docs/plans/URI_EXTERNAL_HARNESS_VIABILITY_GATE.md"
  - id: "LF-1"
    date: "2026-09-28"
    status: "DECIDED"
    decision: "Local first, escalate minimally. External-harness invocation is a cost URI must justify, not the default path: resolve locally, complete locally if qualified, otherwise escalate only the unresolved work, verify independently and locally where possible, record outcome and provenance. Correctness outranks avoiding escalation; Edge/local is never forced beyond demonstrated capability. Frozen S6 routing is unchanged; external-harness escalation is a separate later routing concern."
    recorded_in: "docs/plans/URI_EXTERNAL_HARNESS_VIABILITY_GATE.md section 2; docs/plans/M36_URI_MEMORY_MINIMUM_PLAN.md section 16.3"

